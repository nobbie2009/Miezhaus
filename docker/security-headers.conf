# Sicherheits-Header (keine externen Ressourcen nötig)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# connect-src erlaubt optional ein lokales Sprachmodell (Ollama) unter localhost
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:11434 http://127.0.0.1:11434; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

